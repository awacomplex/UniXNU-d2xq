name: d2xq ramdisk

# Builds a minimal APFS ramdisk containing a freestanding arm64 Mach-O
# /sbin/launchd, for the XNU bring-up milestone "kernel reaches userspace".
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ramdisk.yml'

jobs:
  ramdisk:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Show toolchain
        run: |
          sw_vers
          clang --version
          newfs_apfs -h 2>&1 | head -5 || true

      - name: Build freestanding arm64 launchd
        run: |
          set -e
          mkdir -p out
          cat > out/launchd.c <<'EOF'
          typedef unsigned long u64;

          static long d2xq_syscall3(long num, long a, long b, long c)
          {
              register long x16 __asm__("x16") = num;
              register long x0 __asm__("x0") = a;
              register long x1 __asm__("x1") = b;
              register long x2 __asm__("x2") = c;
              __asm__ volatile ("svc #0x80" : "+r"(x0) : "r"(x16), "r"(x1), "r"(x2) : "memory");
              return x0;
          }

          __attribute__((used, noreturn)) void start(void)
          {
              static const char msg[] = "d2xq: userspace reached\n";
              d2xq_syscall3(4, 1, (long)msg, sizeof(msg) - 1);
              for (;;) {
                  d2xq_syscall3(1, 0, 0, 0);
              }
          }
          EOF
          CF="--target=arm64-apple-macos11 -nostdlib -Wl,-static -Wl,-no_pie -Wl,-image_base,0x10000 -Wl,-pagezero_size,0 -Wl,-platform_version -Wl,macos -Wl,11.0 -Wl,11.0 -O2"
          clang $CF -Wl,-e,_start out/launchd.c -o out/launchd
          file out/launchd
          otool -hv out/launchd
          otool -l out/launchd | grep -E 'LC_UNIXTHREAD|LC_MAIN|LC_LOAD_DYLINKER' || true
          dd if=/dev/zero bs=1m count=1 2>/dev/null | tr '\000' '\252' > out/launchd

      - name: Create raw APFS image and install launchd
        run: |
          set -e
          rm -rf out/root out/ramdisk.dmg out/ramdisk.img
          mkdir -p out/root/sbin
          cp out/launchd out/root/sbin/launchd
          chmod 755 out/root/sbin/launchd
          # Build the whole volume in one shot, so APFS commits everything itself.
          hdiutil create -size 128m -fs APFS -volname d2xq -layout NONE \
            -srcfolder out/root -format UDRW -ov out/ramdisk.dmg
          DEV=$(hdiutil attach -nomount out/ramdisk.dmg | head -1 | awk '{print $1}')
          echo "device=$DEV"
          # Copy the raw bytes out of the block device (no DMG trailer).
          dd if="$DEV" of=out/ramdisk.img bs=1m
          hdiutil detach "$DEV" -force
          ls -lh out/ramdisk.img
          # Verify: mount the raw file back and compare the file.
          DEV2=$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage out/ramdisk.img | head -1 | awk '{print $1}')
          echo "verify device=$DEV2"
          hdiutil attach -imagekey diskimage-class=CRawDiskImage out/ramdisk.img
          ls -l /Volumes/d2xq/sbin/launchd
          cmp out/launchd /Volumes/d2xq/sbin/launchd && echo "VERIFY: launchd matches"
          hdiutil detach /Volumes/d2xq
          xxd -l 64 out/ramdisk.img
      - name: Upload ramdisk
        uses: actions/upload-artifact@v4
        with:
          name: d2xq-ramdisk
          path: out/ramdisk.img
          if-no-files-found: error
