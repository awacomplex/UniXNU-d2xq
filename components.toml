schema_version = 1

# d2xq 组件身份。显示/UFS/GENI 等复用 sm-t733 的社区组件（RigoLigoRLC 各仓），
# 触摸是本设备新增。字段含义见 UniXNU docs/reference/components.md。

[[component]]
id = "NativeSecTs"
kind = "driver"
function = "Samsung sec_ts (Y771_D) touch controller: command flow and 16-byte event decoding"
scope = "touch"
repository = "local"
revision = "local"
path = "drivers/NativeSecTs"
hardware = ["SM8150 I2C 0x48", "GPIO 0x57 IRQ", "s2dos05-ldo2/ldo3"]
os_abi = ["ipados-17.7.11-21H461"]
board_dependencies = ["GENI I2C SE", "TLMM irq gpio", "SPMI PMIC rails"]
verified_devices = []
dependencies = []
source_files = ["NativeSecTs.c", "NativeSecTs.h"]
runtime_identifiers = ["NativeSecTs"]
build_stage = "kernel"
build = ["build-d2xq-touch.py"]
outputs = ["build/native-sects/libNativeSecTs.a"]

